name: Pento
description: >-
  Pento was a European (UK/Danish) automated payroll platform that let companies
  run payroll, sync with accounting and HR tools, and pay employees in a few
  clicks; it was backed by Point Nine and Seedcamp. As of this enrichment pass
  the pento.io domain (HTTP 301) redirects to HiBob (www.hibob.com) and serves
  HiBob's HR-software marketing site with no remaining Pento branding, indicating
  Pento's payroll product has been folded into HiBob. There is no independent
  Pento developer program, API, or documentation surface to enrich; any live
  payroll API now lives under HiBob. This profile is retained as a network lead
  with its acquisition/redirect status recorded.
